name: ChunkVeilStressDriver
version: 1.0.0
main: com.dekaeyman.chunkveil.stress.driver.StressDriverPlugin
api-version: '1.21'
folia-supported: true
description: Drives fake players for ChunkVeil stress tests. Test servers only.
commands:
  stress:
    description: Stress test driver controls.
    usage: /stress <stats|pregen|spread|caves|mine|mobs|config>
    permission: chunkveil.stress
permissions:
  chunkveil.stress:
    default: op
