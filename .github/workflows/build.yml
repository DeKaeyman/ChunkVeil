name: Build

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build and run packet regression tests
        run: ./gradlew build --no-daemon

      - name: Generate SHA-256 checksums
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChunkVeil
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt

  test-matrix:
    name: Tests against Paper API ${{ matrix.paper-api }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every Paper API version the docs list as verified. The default build
        # job already covers 1.21.11; this matrix proves the code also compiles
        # and passes the packet regression suite against the older claimed APIs.
        paper-api:
          - "1.21.8-R0.1-SNAPSHOT"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile and test
        run: ./gradlew build --no-daemon -PpaperApi=${{ matrix.paper-api }}

  compatibility-metadata:
    name: Read canonical compatibility metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      development-version: ${{ steps.metadata.outputs.development-version }}
    steps:
      - uses: actions/checkout@v4
      - id: metadata
        name: Build CI matrix from release-metadata.json
        run: |
          echo "matrix=$(jq -c '{include: [.combinations[] as $c | .protocolLib[$c.protocolLib] as $p | {paper: ($c.paperVersion + "-" + ($c.paperBuild|tostring)), java: ($c.java|tostring), paper_url: $c.paperUrl, paper_sha: $c.paperSha256, protocollib: $p.label, protocollib_url: $p.url, protocollib_sha: $p.sha256}]}' release-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "development-version=$(jq -r '.developmentVersion' release-metadata.json)" >> "$GITHUB_OUTPUT"

  compatibility-boot:
    name: Boot Paper ${{ matrix.paper }} + ${{ matrix.protocollib }}
    needs: [build, compatibility-metadata]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-metadata.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: ChunkVeil
          path: dist
      - name: Boot exact server/plugin combination
        env:
          PAPER_VERSION: ${{ matrix.paper }}
          PAPER_URL: ${{ matrix.paper_url }}
          PAPER_SHA256: ${{ matrix.paper_sha }}
          PROTOCOLLIB_URL: ${{ matrix.protocollib_url }}
          PROTOCOLLIB_SHA256: ${{ matrix.protocollib_sha }}
          CHUNKVEIL_JAR: dist/ChunkVeil-${{ needs.compatibility-metadata.outputs.development-version }}.jar
        run: bash scripts/compatibility-boot.sh

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ChunkVeil
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
          body: |
            Built from commit ${{ github.sha }}.

            Verify your download with the `SHA256SUMS.txt` file attached to this release:

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for what changed.
          append_body: true
