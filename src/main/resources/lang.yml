prefix: "&3[ChunkVeil] &7"

states:
  enabled: "&aenabled"
  disabled: "&cdisabled"

badges:
  ok: "&a[OK]"
  warn: "&e[WARN]"
  fail: "&c[FAIL]"
  info: "&b[INFO]"

commands:
  no-permission: "&cYou do not have permission."
  version: "Version &f{version}"

  help:
    no-commands: "&cYou do not have access to any ChunkVeil commands."
    unknown-command: "&cUnknown command. Available commands:"
    status: "/{label} status"
    compat: "/{label} compat"
    reload: "/{label} reload"
    refresh: "/{label} refresh"
    disable: "/{label} disable"
    enable: "/{label} enable"
    debug: "/{label} debug <on|off>"
    version: "/{label} version"

  status:
    title: "&3&m                                "
    heading: "&bChunkVeil Status"
    section-runtime: "&8- &3Runtime"
    section-compat: "&8- &3Compatibility"
    section-worlds: "&8- &3Worlds"
    section-players: "&8- &3Players & Queues"
    section-protection: "&8- &3Protection Counters"
    section-updates: "&8- &3Update & Entity Counters"
    runtime: "{badge} &7Runtime: {state}"
    disabled-reason: "{badge} &7Disabled reason: &c{reason}"
    debug: "{badge} &7Debug logging: {state}"
    listener: "{badge} &7ProtocolLib listener: {state}"
    rewrite: "{badge} &7Raw chunk packet rewrite: {state}"
    worlds-enabled: "{badge} &7Enabled worlds: &f{worlds}"
    world-overrides: "{badge} &7Configured world entries: &f{worlds}"
    tracked: "{badge} &7Tracked players: &f{players}"
    queued: "{badge} &7Queued chunk updates: &f{chunks}"
    chunk-packets-total: "{badge} &7Chunk packets seen: &f{packets}"
    chunk-packets-hidden: "{badge} &7Hidden chunk packets: &f{hidden}"
    chunk-packets-rewritten: "{badge} &7Rewritten hidden chunks: &f{rewritten}"
    chunk-packets-unrewritten: "{badge} &7Unrewritten hidden chunks: &f{unrewritten}"
    updates-block: "{badge} &7Block changes rewritten: &f{block}"
    updates-multi: "{badge} &7Multi-block changes rewritten: &f{multi}"
    updates-block-entities: "{badge} &7Block entity updates cancelled: &f{block_entities}"
    entities: "{badge} &7Entity spawns cancelled: &f{spawns}&7, follow-up packets cancelled: &f{packets}"

  compat:
    title: "&3&m                                "
    heading: "&bChunkVeil Compatibility"
    section-server: "&8- &3Server"
    section-protocollib: "&8- &3ProtocolLib"
    section-runtime: "&8- &3ChunkVeil Runtime"
    section-warnings: "&8- &3Warnings"
    minecraft: "{badge} &7Minecraft: &f{version}"
    server: "{badge} &7Server: &f{version}"
    bukkit: "{badge} &7Bukkit/Paper API: &f{version}"
    java: "{badge} &7Java: &f{version}"
    protocollib: "{badge} &7ProtocolLib: &f{version}"
    listener: "{badge} &7ProtocolLib listener: {state}"
    rewrite: "{badge} &7Raw chunk packet rewrite: {state}"
    runtime: "{badge} &7Runtime: {state}"
    last-failure: "{badge} &7Last failure: &c{reason}"
    worlds: "{badge} &7Enabled worlds: &f{worlds}"
    warning: "{badge} &e{warning}"
    no-warnings: "{badge} &7No compatibility warnings detected."

  reload: "Reloaded config and language, then refreshed online players."
  refresh: "Refreshed &f{players}&7 online players."
  refresh-disabled: "Runtime is disabled. Use &f/chunkveil enable&7 to start it again."

  disable:
    already: "Runtime is already disabled."
    done: "Runtime disabled. Restored &f{players}&7 players and refreshed &f{chunks}&7 chunks."

  enable:
    already: "Runtime is already enabled."
    done: "Runtime enabled."
    failed: "&cRuntime could not be enabled: {reason}"

  debug:
    usage: "Usage: &f/chunkveil debug <on|off>"
    changed: "Debug {state}&7."
