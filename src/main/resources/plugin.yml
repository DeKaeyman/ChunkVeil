name: ChunkVeil
version: '${version}'
main: com.dekaeyman.chunkveil.ChunkVeilPlugin
api-version: '1.21'
depend:
  - ProtocolLib
softdepend:
  - Orebfuscator
commands:
  chunkveil:
    description: Admin tools for ChunkVeil.
    usage: /chunkveil <status|compat|inspect|report|predict|update|reload|refresh|disable|enable|debug|version>
    aliases:
      - cv
permissions:
  chunkveil.admin:
    description: Allows all ChunkVeil admin commands.
    default: op
    children:
      chunkveil.status: true
      chunkveil.compat: true
      chunkveil.inspect: true
      chunkveil.report: true
      chunkveil.predict: true
      chunkveil.update: true
      chunkveil.reload: true
      chunkveil.refresh: true
      chunkveil.toggle: true
      chunkveil.debug: true
      chunkveil.version: true
  chunkveil.status:
    description: Allows checking ChunkVeil status.
    default: op
  chunkveil.compat:
    description: Allows checking ChunkVeil compatibility diagnostics.
    default: op
  chunkveil.inspect:
    description: Allows inspecting ChunkVeil state for an online player.
    default: op
  chunkveil.report:
    description: Allows generating a ChunkVeil diagnostic report file.
    default: op
  chunkveil.predict:
    description: Allows estimating ChunkVeil performance for a planned server size.
    default: op
  chunkveil.update:
    description: Allows running /chunkveil update and receiving update notices on join.
    default: op
  chunkveil.reload:
    description: Allows reloading ChunkVeil.
    default: op
  chunkveil.refresh:
    description: Allows refreshing ChunkVeil state for online players.
    default: op
  chunkveil.toggle:
    description: Allows enabling or disabling the ChunkVeil runtime emergency switch.
    default: op
  chunkveil.debug:
    description: Allows toggling ChunkVeil debug mode.
    default: op
  chunkveil.version:
    description: Allows checking the ChunkVeil version.
    default: op
  chunkveil.bypass:
    description: Bypasses all ChunkVeil hiding for the player.
    default: false
