plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'com.dekaeyman'
def releaseMetadata = new groovy.json.JsonSlurper().parse(file('release-metadata.json'))
version = releaseMetadata.developmentVersion

// CI and normal local builds continue to use build/. An override is useful
// for recovery when a Windows process or ACL has left generated output locked.
layout.buildDirectory = providers.gradleProperty('buildDirOverride')
        .map { file(it) }
        .orElse(layout.projectDirectory.dir('build'))

def paperMinecraftVersion = releaseMetadata.defaultPaperMinecraft
// Overridable so CI can compile and test against every claimed Paper API
// version: ./gradlew test -PpaperApi=1.21.8-R0.1-SNAPSHOT
def paperApiVersion = providers.gradleProperty('paperApi').getOrElse(releaseMetadata.defaultPaperApi)
def protocolLibVersion = releaseMetadata.compileProtocolLib

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")
    compileOnly("net.dmulloy2:ProtocolLib:${protocolLibVersion}")
    implementation("org.bstats:bstats-bukkit:3.1.0")

    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("io.papermc.paper:paper-api:${paperApiVersion}")
    testImplementation("net.dmulloy2:ProtocolLib:${protocolLibVersion}")
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// The legacy Bukkit scheduler is unsafe on Folia. All scheduling must go
// through VeilScheduler, which routes to Paper's modern schedulers and works
// on both platforms.
tasks.register('checkNoLegacyScheduler') {
    description = 'Fails when runtime sources use the legacy Bukkit scheduler.'
    def sourceDir = file('src/main/java')
    inputs.dir(sourceDir)
    outputs.upToDateWhen { true }
    doLast {
        def legacyPattern = java.util.regex.Pattern.compile(
                /Bukkit\.getScheduler|getServer\(\)\.getScheduler|BukkitRunnable|org\.bukkit\.scheduler\./)
        def violations = []
        sourceDir.eachFileRecurse(groovy.io.FileType.FILES) { sourceFile ->
            if (!sourceFile.name.endsWith('.java')) {
                return
            }
            sourceFile.readLines('UTF-8').eachWithIndex { line, index ->
                if (legacyPattern.matcher(line).find()) {
                    violations << "${sourceFile.name}:${index + 1}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Legacy Bukkit scheduler usage found (use VeilScheduler instead):\n"
                    + violations.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkNoLegacyScheduler')
}

// The distributed jar is the shaded jar: bStats is bundled and relocated so
// it cannot clash with other plugins that also ship bStats.
tasks.named("shadowJar") {
    archiveClassifier = ''
    relocate 'org.bstats', 'com.dekaeyman.chunkveil.libs.bstats'
}

tasks.named("jar") {
    // Replaced by shadowJar, which produces the same archive name without a classifier.
    enabled = false
}

tasks.named("build") {
    dependsOn tasks.named("shadowJar")
}

tasks.named("runServer") {
    minecraftVersion(paperMinecraftVersion)
    pluginJars(tasks.named("shadowJar").flatMap { it.archiveFile })
}

// Local Folia test server: ./gradlew runFolia
// Runs in its own directory on port 25580 so it can run next to a local Paper
// server. ProtocolLib (the pinned dev build from release-metadata.json) is
// downloaded automatically. The server itself runs on Java 25, which the
// pinned ProtocolLib development build requires, independent of the Java 21
// the Gradle build uses.
runPaper.folia.registerTask()

tasks.named("runFolia") {
    minecraftVersion(paperMinecraftVersion)
    runDirectory = layout.projectDirectory.dir('run/folia')
    pluginJars(tasks.named("shadowJar").flatMap { it.archiveFile })
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    def foliaCombination = releaseMetadata.combinations.find { it.platform == 'folia' }
    downloadPlugins {
        url(releaseMetadata.protocolLib[foliaCombination.protocolLib].url)
    }
    doFirst {
        def serverProperties = file('run/folia/server.properties')
        if (!serverProperties.exists()) {
            serverProperties.parentFile.mkdirs()
            serverProperties.text = "server-port=25580\nquery.port=25580\n"
        }
        // Same acceptance this repository already performs for CI boot servers.
        def eula = file('run/folia/eula.txt')
        if (!eula.exists()) {
            eula.text = "eula=true\n"
        }
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    from('release-metadata.json')
}

tasks.register('syncUpdateManifest') {
    description = 'Regenerates update.json from the canonical release metadata.'
    inputs.file('release-metadata.json')
    outputs.file('update.json')
    doLast {
        file('update.json').text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([releases: releaseMetadata.releases])) + System.lineSeparator()
    }
}
