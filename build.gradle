plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'com.dekaeyman'
def releaseMetadata = new groovy.json.JsonSlurper().parse(file('release-metadata.json'))
version = releaseMetadata.developmentVersion

// CI and normal local builds continue to use build/. An override is useful
// for recovery when a Windows process or ACL has left generated output locked.
layout.buildDirectory = providers.gradleProperty('buildDirOverride')
        .map { file(it) }
        .orElse(layout.projectDirectory.dir('build'))

def paperMinecraftVersion = releaseMetadata.defaultPaperMinecraft
// Overridable so CI can compile and test against every claimed Paper API
// version: ./gradlew test -PpaperApi=1.21.8-R0.1-SNAPSHOT
def paperApiVersion = providers.gradleProperty('paperApi').getOrElse(releaseMetadata.defaultPaperApi)
def protocolLibVersion = releaseMetadata.compileProtocolLib

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")
    compileOnly("net.dmulloy2:ProtocolLib:${protocolLibVersion}")
    implementation("org.bstats:bstats-bukkit:3.1.0")

    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("io.papermc.paper:paper-api:${paperApiVersion}")
    testImplementation("net.dmulloy2:ProtocolLib:${protocolLibVersion}")
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// The distributed jar is the shaded jar: bStats is bundled and relocated so
// it cannot clash with other plugins that also ship bStats.
tasks.named("shadowJar") {
    archiveClassifier = ''
    relocate 'org.bstats', 'com.dekaeyman.chunkveil.libs.bstats'
}

tasks.named("jar") {
    // Replaced by shadowJar, which produces the same archive name without a classifier.
    enabled = false
}

tasks.named("build") {
    dependsOn tasks.named("shadowJar")
}

tasks.named("runServer") {
    minecraftVersion(paperMinecraftVersion)
    pluginJars(tasks.named("shadowJar").flatMap { it.archiveFile })
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    from('release-metadata.json')
}

tasks.register('syncUpdateManifest') {
    description = 'Regenerates update.json from the canonical release metadata.'
    inputs.file('release-metadata.json')
    outputs.file('update.json')
    doLast {
        file('update.json').text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([releases: releaseMetadata.releases])) + System.lineSeparator()
    }
}
